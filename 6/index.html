<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сложный пример CSS Grid</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            flex-direction: column;
            padding: 20px;
        }

        .grid-container {
            display: grid;
            width: 90%;
            grid-template-columns: repeat(7, 1fr);
            grid-gap: 10px;
            max-width: 1200px;
            grid-template-areas:
                "wid wid wid vovsy vovsy vovsy ."
                "bot bot bot bot bot bot ."
                "big big . . . . ."
                ". . . . . . footer";
            margin-bottom: 50px;
        }

        .grid-item {
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5em;
            font-weight: bold;
            border-radius: 8px;
            padding: 20px;
            height: 70px;
        }

        .item4 {
            background-color: #4D96FF;
            grid-area: footer;
        }

        .item5 {
            background-color: #FFB6B9;
            grid-area: big;
            height: 210px;
        }

        .item6 {
            background-color: #A1E8AF;
            grid-area: wid;
        }

        .item7 {
            background-color: #FFE156;
            grid-area: vovsy;
        }

        .item8 {
            background-color: #FF9F1C;
            grid-area: bot;
        }

        .dop-section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        .dop-section h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .dop-link {
            display: inline-block;
            background: linear-gradient(45deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 18px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .dop-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(106, 17, 203, 0.3);
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="grid-item item6">Широкий блок</div>
        <div class="grid-item item7">Во всю ширину</div>
        <div class="grid-item item8">Нижний блок</div>
        <div class="grid-item item5">Большой блок</div>
        <div class="grid-item item4">Футер</div>
    </div>

    <div class="dop-section">
        <a href="answers.html" class="dop-link">Перейти к ответам на вопросы →</a>
                <a href="vizitka.html" class="dop-link">Перейти к визитке →</a>
    </div>
</body>
</html>
