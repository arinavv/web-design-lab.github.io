<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>To-Do List</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">

    <nav class="nav">
        <div class="logo">To-Do DOM</div>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html" class="active">Задачи</a></li>
            <li><a href="answers.html">Ответы</a></li>
        </ul>
        <div class="burger" id="burger">☰</div>
    </nav>

    <main class="container">
        <h1>Список задач</h1>

        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Введите задачу">
            <button id="addTaskBtn">Добавить</button>
        </div>

        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="completed">Выполненные</button>
            <button class="filter-btn" data-filter="uncompleted">Невыполненные</button>
        </div>

        <ul id="taskList"></ul>
    </main>

</div>

<script src="script.js"></script>
</body>
</html>
